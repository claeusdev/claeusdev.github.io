<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en-us">
  <head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title | default: site.title }}</title>
    <meta name="author" content="{{ site.author }}" />

    <!-- syntax highlighting CSS -->
    <link rel="stylesheet" href="/assets/css/syntax.css" type="text/css" />

    <!-- Homepage CSS -->
    <link
      rel="stylesheet"
      href="/assets/css/screen.css"
      type="text/css"
      media="screen, projection"
    />

    <!-- MathJax -->
    <script type="text/x-mathjax-config">
      MathJax.Hub.Config({
        tex2jax: {
          inlineMath: [['$','$'], ['\\(','\\)']],
          processEscapes: true
        }
      });
    </script>
    <script
      type="text/javascript"
      async
      src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-MML-AM_CHTML"
    ></script>
  </head>
  <body>
    <div class="site">
      <div class="title">
        <a href="/">{{ site.title }}</a>
        <a class="extra" href="/">home</a>
      </div>

      {{ content }}

      <div class="footer">
        <div class="contact">
          <p>
            {{ site.author }}
            <br />
            {{ site.description }}
            <br />
            {{ site.email }}
            <br />
            Theme modeled after <a href="https://tom.preston-werner.com/">Tom Preston-Werner</a>
          </p>
        </div>
        <div class="contact">
          <p>
            <a href="https://github.com/{{ site.github_username }}"
              >github.com/{{ site.github_username }}</a
            ><br />
            <a href="https://twitter.com/{{ site.twitter_username }}"
              >twitter.com/{{ site.twitter_username }}</a
            ><br />
          </p>
        </div>
        <div class="rss">
          <a href="/feed.xml">
            <img src="/assets/images/rss.svg" alt="Subscribe to RSS Feed" />
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
