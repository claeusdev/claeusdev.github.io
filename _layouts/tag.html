---
layout: default
---
<h1 class="text-2xl font-semibold mb-2">#{{ page.title }}</h1>
<p class="text-md text-gray-700 mb-12">
  {{ page.posts.size }} post{% if page.posts.size != 1 %}s{% endif %} tagged &ldquo;{{ page.title }}&rdquo;.
  <a href="{{ '/tags/' | relative_url }}" class="text-blue-600 hover:text-blue-800 transition duration-300">All tags</a>
</p>

{% for post in page.posts %}
  {% include post-list-item.html post=post %}
{% endfor %}
