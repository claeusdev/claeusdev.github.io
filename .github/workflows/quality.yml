name: Quality

# Runs on PRs and on pushes to any branch except the deploy branch.
# Independent of deploy.yml — this never publishes, it only checks.
on:
  pull_request:
  push:
    branches-ignore: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Build & link check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install CSS toolchain
        run: npm ci

      - name: Build CSS
        run: npm run build:css

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--offline --base _site --no-progress '_site/**/*.html'"
          fail: true
