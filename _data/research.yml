- title: "AgentLang (AGL): A Typed Language for Agentic Workflows"
  kind: Repo
  year: 2026
  authors:
    - Nana Adjei Manu
  description: >-
    A small typed DSL for agentic workflows, implemented as a Rust library and
    CLI: agents and tasks with typed inputs and outputs, composed into pipelines
    with parallel steps, retry and fallback, and run against deterministic mock
    handlers or live OpenAI and Anthropic adapters.
  links:
    - label: GitHub
      url: https://github.com/naamanu/agl

- title: "rarepath: Observability-Preserving Trace Sampling"
  kind: Repo
  year: 2026
  authors:
    - Nana Adjei Manu
  description: >-
    A Go implementation of behaviour-diverse trace sampling following Microsoft
    Research's STEAM paper — retains rare execution paths that uniform random
    sampling discards.
  links:
    - label: GitHub
      url: https://github.com/naamanu/rarepath

- title: "L-Language: A Minimal Functional Language with an Evaluation Visualizer"
  kind: Repo
  year: 2025
  authors:
    - Nana Adjei Manu
  description: >-
    A small functional language implemented in Haskell, paired with a React
    visualizer that steps through evaluation and operational semantics rules.
    Grew out of my MSc thesis on operational semantics at the University of
    Leicester.
  links:
    - label: GitHub
      url: https://github.com/claeusdev/l-lang
    - label: Series
      url: /blog/operational-semantics-1-formal-intro/

- title: "causality: Ranked Root-Cause Hypotheses from Logs and Traces"
  kind: Repo
  year: 2026
  authors:
    - Nana Adjei Manu
  description: >-
    An incident root-cause assistant for on-call engineers that ranks
