<article class="mb-12 pb-8 border-b border-gray-200 last:border-b-0">
  <h2 class="text-lg font-semibold mb-2">
    <a href="{{ include.post.url | relative_url }}"
       class="text-blue-600 hover:text-blue-800 transition duration-300">{{ include.post.title }}</a>
  </h2>
  <p class="text-sm text-gray-600 mb-4">
    <time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%B %-d, %Y" }}</time>
  </p>
  {% if include.post.description %}
    <p class="text-gray-700 mb-4">{{ include.post.description }}</p>
  {% endif %}
  <a href="{{ include.post.url | relative_url }}"
     class="text-blue-600 hover:text-blue-800 font-medium transition duration-300">Read more &rarr;</a>
</article>
