<li class="dated">
  <time class="date" datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%d %b %Y" }}</time>
  <div class="flex flex-col gap-y-0.5">
    <a href="{{ include.post.url | relative_url }}" class="link">{{ include.post.title }}</a>
    {% if include.post.description %}
      <p class="text-[15px] text-stone-600">{{ include.post.description }}</p>
    {% endif %}
  </div>
</li>
